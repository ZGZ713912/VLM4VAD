name: Build Devcontainer Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        torch_variant:
          - cpu
          - cu121

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: vars
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vlm4vad-devcontainer" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_name }}
          tags: |
            type=raw,value=${{ matrix.torch_variant }}
            type=raw,value=${{ github.ref_name }}-${{ matrix.torch_variant }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: |
            TORCH_VARIANT=${{ matrix.torch_variant }}
          cache-from: type=gha,scope=devcontainer-${{ matrix.torch_variant }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.torch_variant }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
